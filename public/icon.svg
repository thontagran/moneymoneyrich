<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Base Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.15" />
  
  <!-- Shield / Compass Core Structure -->
  <g filter="url(#shadow)">
    <!-- Upward Trend Chart Bars -->
    <rect x="130" y="270" width="46" height="110" rx="14" fill="#ffffff" opacity="0.25" />
    <rect x="194" y="220" width="46" height="160" rx="14" fill="#ffffff" opacity="0.45" />
    <rect x="258" y="160" width="46" height="220" rx="14" fill="url(#chartGrad)" />
    
    <!-- Rocketing Trend Arrow -->
    <path d="M 130 310 L 210 240 L 270 270 L 360 145" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrow Head -->
    <polygon points="385,140 330,135 365,185" fill="#ffffff" />
    
    <!-- Gold Star / Sparkle Point -->
    <circle cx="370" cy="150" r="18" fill="url(#sparkGrad)" />
    <polygon points="370,126 376,144 394,150 376,156 370,174 364,156 346,150 364,144" fill="#ffffff" />
  </g>
</svg>
